name: Find pictures

# Looks up the freely licensed lead photo on a person's Wikipedia page.
# Give the Wikipedia page names separated by "|", e.g. Adele|Ed_Sheeran
on:
  workflow_dispatch:
    inputs:
      names:
        description: Wikipedia page names separated by |
        required: true

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - env:
          NAMES: ${{ inputs.names }}
        run: |
          set +e
          UA="news-site-picture-lookup/1.0"
          echo "$NAMES" | tr '|' '\n' | while read -r T; do
            sleep 4
            F=$(curl -sS -A "$UA" -G "https://en.wikipedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "redirects=1" --data-urlencode "prop=pageimages" --data-urlencode "piprop=name" --data-urlencode "titles=$T" | jq -r '.query.pages[].pageimage')
            echo "@@ $T => $F"
            curl -sS -A "$UA" -G "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|size|extmetadata" --data-urlencode "iiurlwidth=1280" --data-urlencode "iiextmetadatafilter=LicenseShortName|Artist|ImageDescription|DateTimeOriginal" --data-urlencode "titles=File:$F" | jq -c '.query.pages[].imageinfo[0] | {thumburl, thumbwidth, thumbheight, lic: .extmetadata.LicenseShortName.value, artist: .extmetadata.Artist.value, desc: .extmetadata.ImageDescription.value, date: .extmetadata.DateTimeOriginal.value}' | sed 's/^/@@ /'
          done
